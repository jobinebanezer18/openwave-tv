name: Build unsigned preview

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Test and package unsigned preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
          cache: true
      - run: npm ci
      - run: node scripts/validate-web-catalog.mjs
      - run: node scripts/validate-world-catalog.mjs
      - run: node --test scripts/validate-web-catalog.test.mjs
      - run: npm run build
      - run: npm run build:web
      - run: go test ./...
      - run: npm test
      - run: node scripts/validate-rights-register.mjs
      - run: node --test scripts/validate-rights-register.test.mjs
      - run: npm audit --audit-level=moderate
      - name: Build unsigned archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="openwave-tv-${os}-${arch}"
            extension=""
            if [ "$os" = windows ]; then extension=".exe"; fi
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags='-s -w' -o "release/${name}${extension}" .
            if [ "$os" = windows ]; then
              (cd release && zip "${name}.zip" "${name}.exe")
              rm "release/${name}.exe"
            else
              (cd release && tar -czf "${name}.tar.gz" "$name")
              rm "release/$name"
            fi
          done
          (cd release && sha256sum *.tar.gz *.zip > SHA256SUMS)
          cat > release/UNSIGNED-PREVIEW.txt <<'NOTICE'
          These archives are unsigned technical previews. They have not been
          notarized by Apple or signed with a trusted Windows publisher identity.
          Verify SHA256SUMS against downloads from the official GitHub release.
          NOTICE
      - name: Upload exact preview archives and checksums
        uses: actions/upload-artifact@v7
        with:
          name: openwave-tv-unsigned-preview
          path: release/
          if-no-files-found: error

  smoke:
    name: Smoke packaged app on ${{ matrix.os }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
          cache: true
      - uses: actions/download-artifact@v8
        with:
          name: openwave-tv-unsigned-preview
          path: release
      - name: Verify exact archive and local startup
        run: go run ./scripts/smoke-release.go -dir release

  macos-dmg:
    name: Build and smoke universal macOS DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
          cache: true
      - run: npm ci
      - run: bash scripts/package-macos.sh "$GITHUB_WORKSPACE/release-mac"
      - name: Sign Mac update feed
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SPARKLE_PRIVATE_KEY"
          tar -xf work/vendor-cache/Sparkle-2.10.0.tar.xz -C work/macos-package/sparkle ./bin/generate_appcast ./bin/sign_update
          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          chmod 600 "$key_file"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$key_file"
          work/macos-package/sparkle/bin/generate_appcast \
            --ed-key-file "$key_file" \
            --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/" \
            -o "$GITHUB_WORKSPACE/release-mac/macos.xml" "$GITHUB_WORKSPACE/release-mac"
          python3 scripts/label-macos-appcast.py "$GITHUB_WORKSPACE/release-mac/macos.xml" "$GITHUB_REF_NAME"
          work/macos-package/sparkle/bin/sign_update --ed-key-file "$key_file" "$GITHUB_WORKSPACE/release-mac/macos.xml"
          work/macos-package/sparkle/bin/sign_update --ed-key-file "$key_file" --verify "$GITHUB_WORKSPACE/release-mac/macos.xml"
      - name: Check packaged app startup and quit
        shell: bash
        run: |
          set -euo pipefail
          app_binary="work/macos-package/dmg-stage/OpenWave TV.app/Contents/Resources/openwave-server"
          "$app_binary" -no-browser -addr 127.0.0.1:8769 > work/macos-package/smoke.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8769/ -o /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8769/ -o /dev/null
          curl -fsS -X POST -H 'X-OpenWave-Action: quit' http://127.0.0.1:8769/api/quit -o /dev/null
          wait "$app_pid"
          launcher_archs="$(lipo -archs "work/macos-package/dmg-stage/OpenWave TV.app/Contents/MacOS/OpenWave TV")"
          [[ " $launcher_archs " == *" arm64 "* ]]
          [[ " $launcher_archs " == *" x86_64 "* ]]
          (cd release-mac && shasum -a 256 -c *.dmg.sha256)
      - uses: actions/upload-artifact@v7
        with:
          name: openwave-tv-macos-dmg
          path: release-mac/
          if-no-files-found: error

  release:
    name: Publish tested unsigned preview
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, smoke, macos-dmg]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: openwave-tv-unsigned-preview
          path: release
      - uses: actions/download-artifact@v8
        with:
          name: openwave-tv-macos-dmg
          path: release
      - name: Verify all archives and publish exactly those files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd release && sha256sum -c SHA256SUMS)
          (cd release && sha256sum -c *.dmg.sha256)
          gh release create "$GITHUB_REF_NAME" release/*.tar.gz release/*.zip release/*.dmg release/*.dmg.sha256 release/macos.xml release/SHA256SUMS release/UNSIGNED-PREVIEW.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME — unsigned preview" \
            --prerelease --generate-notes
