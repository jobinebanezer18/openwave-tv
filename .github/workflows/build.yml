name: Build unsigned preview

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Test and package unsigned preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
          cache: true
      - run: npm ci
      - run: node scripts/validate-web-catalog.mjs
      - run: node scripts/validate-world-catalog.mjs
      - run: node --test scripts/validate-web-catalog.test.mjs
      - run: npm run build
      - run: npm run build:web
      - run: go test ./...
      - run: npm test
      - run: node scripts/validate-rights-register.mjs
      - run: node --test scripts/validate-rights-register.test.mjs
      - run: npm audit --audit-level=moderate
      - name: Build unsigned archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="openwave-tv-${os}-${arch}"
            extension=""
            if [ "$os" = windows ]; then extension=".exe"; fi
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags='-s -w' -o "release/${name}${extension}" .
            if [ "$os" = windows ]; then
              (cd release && zip "${name}.zip" "${name}.exe")
              rm "release/${name}.exe"
            else
              (cd release && tar -czf "${name}.tar.gz" "$name")
              rm "release/$name"
            fi
          done
          (cd release && sha256sum *.tar.gz *.zip > SHA256SUMS)
          cat > release/UNSIGNED-PREVIEW.txt <<'NOTICE'
          These archives are unsigned technical previews. They have not been
          notarized by Apple or signed with a trusted Windows publisher identity.
          Verify SHA256SUMS against downloads from the official GitHub release.
          NOTICE
      - name: Upload exact preview archives and checksums
        uses: actions/upload-artifact@v7
        with:
          name: openwave-tv-unsigned-preview
          path: release/
          if-no-files-found: error

  smoke:
    name: Smoke packaged app on ${{ matrix.os }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
          cache: true
      - uses: actions/download-artifact@v8
        with:
          name: openwave-tv-unsigned-preview
          path: release
      - name: Verify exact archive and local startup
        run: go run ./scripts/smoke-release.go -dir release

  macos-dmg:
    name: Build and smoke universal macOS DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
          cache: true
      - run: npm ci
      - run: bash scripts/package-macos.sh "$GITHUB_WORKSPACE/release-mac"
      - name: Sign Mac update feed
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SPARKLE_PRIVATE_KEY"
          tar -xf work/vendor-cache/Sparkle-2.10.0.tar.xz -C work/macos-package/sparkle ./bin/generate_appcast ./bin/sign_update
          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          chmod 600 "$key_file"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$key_file"
          work/macos-package/sparkle/bin/generate_appcast \
            --ed-key-file "$key_file" \
            --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/" \
            -o "$GITHUB_WORKSPACE/release-mac/macos.xml" "$GITHUB_WORKSPACE/release-mac"
          python3 scripts/label-macos-appcast.py "$GITHUB_WORKSPACE/release-mac/macos.xml" "$GITHUB_REF_NAME"
          work/macos-package/sparkle/bin/sign_update --ed-key-file "$key_file" "$GITHUB_WORKSPACE/release-mac/macos.xml"
          work/macos-package/sparkle/bin/sign_update --ed-key-file "$key_file" --verify "$GITHUB_WORKSPACE/release-mac/macos.xml"
      - name: Check packaged app startup and quit
        shell: bash
        run: |
          set -euo pipefail
          app_binary="work/macos-package/dmg-stage/OpenWave TV.app/Contents/Resources/openwave-server"
          "$app_binary" -no-browser -addr 127.0.0.1:8769 > work/macos-package/smoke.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8769/ -o /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8769/ -o /dev/null
          curl -fsS -X POST -H 'X-OpenWave-Action: quit' http://127.0.0.1:8769/api/quit -o /dev/null
          wait "$app_pid"
          launcher_archs="$(lipo -archs "work/macos-package/dmg-stage/OpenWave TV.app/Contents/MacOS/OpenWave TV")"
          [[ " $launcher_archs " == *" arm64 "* ]]
          [[ " $launcher_archs " == *" x86_64 "* ]]
          (cd release-mac && shasum -a 256 -c *.dmg.sha256)
      - uses: actions/upload-artifact@v7
        with:
          name: openwave-tv-macos-dmg
          path: release-mac/
          if-no-files-found: error

  android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - run: chmod +x android/gradlew
      - run: ./android/gradlew -p android :app:assembleDebug --no-daemon
      - name: Sign release APK
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          OPENWAVE_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          OPENWAVE_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          mkdir -p work/android-signing release-android
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > work/android-signing/openwave-release.jks
          chmod 600 work/android-signing/openwave-release.jks
          export OPENWAVE_ANDROID_KEYSTORE="$GITHUB_WORKSPACE/work/android-signing/openwave-release.jks"
          ./android/gradlew -p android :app:assembleRelease --no-daemon
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk | tee work/android-signing/verification.txt
          grep -F 'e3c1c508ed5a178c82a23151a551cb2d547e94e4c5c24b46889ce00bfe17b803' work/android-signing/verification.txt
          version="${GITHUB_REF_NAME#v}"
          asset="OpenWave-TV-${version}-Android.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "release-android/$asset"
          (cd release-android && sha256sum "$asset" > "$asset.sha256")
      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: openwave-tv-android-apk
          path: release-android/
          if-no-files-found: error

  windows-web:
    name: Build Windows web-app EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
          cache: true
      - name: Build portable GUI launcher
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $asset = "OpenWave-TV-$version-Windows-Web.exe"
          $windowsVersion = $version -replace '-beta\.', '.'
          New-Item -ItemType Directory -Force release-windows | Out-Null
          go run github.com/tc-hib/go-winres@v0.3.3 simply --arch amd64 --out cmd/windows-web/rsrc --manifest gui --icon public/icons/icon-512.png --file-description 'OpenWave TV web app' --product-name 'OpenWave TV' --product-version $windowsVersion --file-version $windowsVersion --original-filename $asset
          if ($LASTEXITCODE -ne 0) { throw 'Windows resources failed to build' }
          go build -trimpath -ldflags '-H=windowsgui -s -w' -o "release-windows/$asset" ./cmd/windows-web
          if ($LASTEXITCODE -ne 0) { throw 'Windows launcher build failed' }
          $bytes = [System.IO.File]::ReadAllBytes("$PWD/release-windows/$asset")
          if ($bytes.Length -lt 500000 -or $bytes[0] -ne 77 -or $bytes[1] -ne 90) { throw 'Launcher is not a Windows executable' }
          $launcher = Start-Process -FilePath "$PWD/release-windows/$asset" -PassThru
          if (-not $launcher.WaitForExit(15000)) { $launcher.Kill(); throw 'Windows launcher did not finish starting' }
          if ($launcher.ExitCode -ne 0) { throw "Windows launcher exited with $($launcher.ExitCode)" }
          $hash = (Get-FileHash "release-windows/$asset" -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText("$PWD/release-windows/$asset.sha256", "$hash  $asset`n", [System.Text.Encoding]::ASCII)
      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: openwave-tv-windows-web
          path: release-windows/
          if-no-files-found: error

  release:
    name: Publish tested unsigned preview
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, smoke, macos-dmg, android-apk, windows-web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: openwave-tv-unsigned-preview
          path: release
      - uses: actions/download-artifact@v8
        with:
          name: openwave-tv-macos-dmg
          path: release
      - uses: actions/download-artifact@v8
        with:
          name: openwave-tv-android-apk
          path: release
      - uses: actions/download-artifact@v8
        with:
          name: openwave-tv-windows-web
          path: release
      - name: Verify all archives and publish exactly those files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd release && sha256sum -c SHA256SUMS)
          (cd release && sha256sum -c *.dmg.sha256)
          (cd release && sha256sum -c *.apk.sha256)
          (cd release && sha256sum -c *Windows-Web.exe.sha256)
          gh release create "$GITHUB_REF_NAME" release/*.tar.gz release/*.zip release/*.dmg release/*.dmg.sha256 release/*.apk release/*.apk.sha256 release/*Windows-Web.exe release/*Windows-Web.exe.sha256 release/macos.xml release/SHA256SUMS release/UNSIGNED-PREVIEW.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME — unsigned preview" \
            --prerelease --generate-notes
