name: Build unsigned preview

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Test and package unsigned preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
          cache: true
      - run: npm ci
      - run: npm run build
      - run: go test ./...
      - run: npm test
      - run: node scripts/validate-rights-register.mjs
      - run: node --test scripts/validate-rights-register.test.mjs
      - run: npm audit --audit-level=moderate
      - name: Build unsigned archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="openwave-tv-${os}-${arch}"
            extension=""
            if [ "$os" = windows ]; then extension=".exe"; fi
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags='-s -w' -o "release/${name}${extension}" .
            if [ "$os" = windows ]; then
              (cd release && zip "${name}.zip" "${name}.exe")
              rm "release/${name}.exe"
            else
              (cd release && tar -czf "${name}.tar.gz" "$name")
              rm "release/$name"
            fi
          done
          (cd release && sha256sum *.tar.gz *.zip > SHA256SUMS)
          cat > release/UNSIGNED-PREVIEW.txt <<'NOTICE'
          These archives are unsigned technical previews. They have not been
          notarized by Apple or signed with a trusted Windows publisher identity.
          Verify SHA256SUMS against downloads from the official GitHub release.
          NOTICE
      - name: Upload exact preview archives and checksums
        uses: actions/upload-artifact@v7
        with:
          name: openwave-tv-unsigned-preview
          path: release/
          if-no-files-found: error

  smoke:
    name: Smoke packaged app on ${{ matrix.os }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
          cache: true
      - uses: actions/download-artifact@v8
        with:
          name: openwave-tv-unsigned-preview
          path: release
      - name: Verify exact archive and local startup
        run: go run ./scripts/smoke-release.go -dir release

  release:
    name: Publish tested unsigned preview
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: openwave-tv-unsigned-preview
          path: release
      - name: Verify all archives and publish exactly those files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd release && sha256sum -c SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" release/*.tar.gz release/*.zip release/SHA256SUMS release/UNSIGNED-PREVIEW.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME — unsigned preview" \
            --prerelease --generate-notes
